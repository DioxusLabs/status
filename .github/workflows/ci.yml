name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p dioxus-status --features server --profile server-dev --target x86_64-unknown-linux-gnu -- -D warnings
      - run: cargo clippy -p dioxus-status --features web --target wasm32-unknown-unknown --profile wasm-dev -- -D warnings
      - run: cargo test -p dioxus-status --features server --profile server-dev --target x86_64-unknown-linux-gnu
